# Abdoh configuration. Copied to config.yaml on first run; edit config.yaml, not this file.

config_version: 3                # written by Abdoh, for upgrading this file; don't change it
wake_words: ["abdoh", "hey abdoh", "ya abdoh"]
# Your openWakeWord model (see README: train the wake word). Without it, Vosk is used.
wake_word_model: "models/hey_abdoh.onnx"
wake_word_threshold: 0.4         # higher = fewer false wake-ups, lower = wakes more easily
hotkey: "ctrl+alt+space"         # press to talk without the wake word, or to stop a reply; "" = off
# Vosk only: words it might hear instead of "Abdoh". `python -m abdoh calibrate` finds yours.
wake_word_aliases: ["abdo", "ab doe", "abdul", "hey abdo", "hey abdul"]
vosk_model: "models/vosk-model-small-en-us-0.15"
languages: ["en"]                # what you speak to Abdoh, e.g. ["en"] or ["en", "ar"]
speech_engine: "auto"            # auto | parakeet (English only, most accurate) | whisper
whisper_model: "small"           # Whisper size for languages other than English: base | small | medium
match_threshold: 85
silence_seconds: 0.6              # pause that ends a request (speech is detected by a VAD)
max_record_seconds: 10
follow_up_seconds: 6             # after Claude answers, keep listening this long (no wake word); 0 = off
wake_word_interrupts: true       # say the wake word while Abdoh is talking to stop it
voice_interrupts: true           # or just start talking: Abdoh goes quiet and listens
voice_interrupt_sensitivity: medium  # low | medium | high: how easily your voice stops Abdoh
tts_rate: 175                    # speaking speed in words per minute
tts_voice: ""                    # a voice's name (pick one in the app); "" = Windows' default voice
mic_device: ""                   # a microphone's name (pick one in the app); "" = Windows' default
allow_run: false                 # let your commands run programs (the "run" action)
check_updates: true              # look for a new version of Abdoh once a day
setup_done: false                # the first-start setup was finished or skipped
claude:
  backend: "auto"                # auto: Claude Code if installed (your subscription), else API key
                                 # code | api | off
  code_path: ""                  # path to claude.exe; empty = find it automatically
  code_model: ""                 # Claude Code model, e.g. "sonnet"; empty = your default
  model: "claude-opus-5-5"       # API key only: any current Claude model id
  max_tokens: 4000               # API key only
  effort: "low"                  # low = quickest answers
  allow_web: true                # let Claude search the web (Claude Code)
  allow_files: true              # let Claude work with your files and run PowerShell (Claude Code);
                                 # it asks before deleting or overwriting anything
  folders: []                    # where Claude may work with files; [] = your home folder
  allow_screen: true             # let Claude look at your screen when you ask about it
  # What Claude may do on the computer (turn them on and off on the Permissions page):
  actions: ["open_url", "open_app", "play_youtube", "media", "timer", "volume", "brightness", "remind", "note"]
  instructions: ""               # your own instructions for Claude, sent with every request
  timeout_seconds: 120
  followup_seconds: 60           # a question within this time can follow up on the last answer
  listen_after_question: true    # when Claude asks you something, just answer (no wake word)
  translate_target: "English"
  voice_reply_max_sentences: 4
log_file: "~/.abdoh/abdoh.log"
