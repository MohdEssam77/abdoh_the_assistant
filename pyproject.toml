[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abdoh"
dynamic = ["version"]
description = "A simple, voice-first personal assistant for your laptop."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sounddevice>=0.4",
    "numpy>=1.26",
    "faster-whisper>=1.0",
    "huggingface_hub>=0.21,<2", # 2.x left an empty model.bin in the built app's model cache
    "onnxruntime>=1.17",
    "onnx-asr>=0.12", # runs the Parakeet speech model on onnxruntime (numpy only, no torch)
    "pyttsx3>=2.90",
    "comtypes>=1.2; sys_platform == 'win32'",
    "rapidfuzz>=3.0",
    "PyYAML>=6.0",
    "mss>=9.0",
    "Pillow>=10.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "pystray>=0.19",
    "pywebview>=6.0",
    "livekit>=1.3", # WebRTC's echo canceller: hearing you while Abdoh talks
    "piper-tts>=1.3", # natural voices in every language (GPL-3.0; offline, onnxruntime)
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
build = ["pyinstaller>=6.0"]

[project.scripts]
abdoh = "abdoh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"abdoh.ui" = ["web/*"]

[tool.setuptools.dynamic]
version = { attr = "abdoh.__version__" }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
