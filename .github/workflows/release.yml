# Builds Krekos-Setup.exe on Windows. Pushing a version tag (git tag v0.3.0; git push origin v0.3.0)
# also publishes it as a GitHub Release, which the download page and the in-app update check use.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # build from the Actions tab, without publishing

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Krekos and the build tools
        run: python -m pip install -e ".[build,dev]"

      - name: Run the tests
        run: python -m pytest -q

      - name: Download the speech models
        run: python scripts/download_models.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Krekos-Setup.exe
        run: python scripts/build_installer.py

      # Xanthos and Abdoh (the old names) look for their own installer's name when they check
      # for updates: the same installer goes up under those names too.
      - name: Copy the installer for the old names
        run: |
          Copy-Item dist/Krekos-Setup.exe dist/Xanthos-Setup.exe
          Copy-Item dist/Krekos-Setup.exe dist/Abdoh-Setup.exe

      - uses: actions/upload-artifact@v7
        with:
          path: dist/Krekos-Setup.exe
          archive: false # the installer itself, not a zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Krekos-Setup.exe
            dist/Xanthos-Setup.exe
            dist/Abdoh-Setup.exe
          body: |
            **Download `Krekos-Setup.exe` below** and run it. It installs Krekos for you only (no admin rights) and walks you through the setup.

            Krekos was called Xanthos (and Abdoh before that): `Xanthos-Setup.exe` and `Abdoh-Setup.exe` are the same installer, there so older versions find this update. Installing replaces the old version and keeps your settings.

            Windows may say "Windows protected your PC", because the installer isn't code-signed yet: click **More info**, then **Run anyway**.

            Needs Windows 10 or 11 (64-bit), 8 GB of memory and a microphone. The download is large because the speech recognition model is inside (nothing is downloaded later). For answers from Claude, connect your own Claude Pro or Max account (or an API key) in the setup; your own commands work without it.
          generate_release_notes: true
