# Builds Abdoh-Setup.exe on Windows. Pushing a version tag (git tag v0.3.0; git push origin v0.3.0)
# also publishes it as a GitHub Release, which the download page and the in-app update check use.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # build from the Actions tab, without publishing

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Abdoh and the build tools
        run: python -m pip install -e ".[build,dev]"

      - name: Run the tests
        run: python -m pytest -q

      - name: Download the speech models
        run: python scripts/download_models.py

      # Optional: a trained "Hey Abdoh" model to bundle. Set the repository variable
      # WAKE_WORD_URL (Settings > Secrets and variables > Actions > Variables) to its download URL.
      - name: Add the trained wake word model
        if: ${{ vars.WAKE_WORD_URL != '' }}
        run: Invoke-WebRequest -Uri "${{ vars.WAKE_WORD_URL }}" -OutFile models/hey_abdoh.onnx

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Abdoh-Setup.exe
        run: python scripts/build_installer.py

      - uses: actions/upload-artifact@v7
        with:
          path: dist/Abdoh-Setup.exe
          archive: false # the installer itself, not a zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Abdoh-Setup.exe
          body: |
            **Download `Abdoh-Setup.exe` below** and run it. It installs Abdoh for you only (no admin rights) and walks you through the setup.

            Windows may say "Windows protected your PC", because the installer isn't code-signed yet: click **More info**, then **Run anyway**.

            Needs Windows 10 or 11 (64-bit), 8 GB of memory and a microphone. The download is large because the speech recognition model is inside (nothing is downloaded later). For answers from Claude, connect your own Claude Pro or Max account (or an API key) in the setup; your own commands work without it.
          generate_release_notes: true
